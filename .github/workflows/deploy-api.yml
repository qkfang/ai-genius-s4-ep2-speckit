name: Deploy API to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '9.0.x'
  PROJECT_PATH: src/ai-genius-api/ai-genius-api.csproj
  PUBLISH_DIR: ./publish
  PACKAGE_PATH: ./api.zip

jobs:
  deploy-api:
    name: Build and deploy API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish API
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ${{ env.PUBLISH_DIR }}

      - name: Zip publish output
        run: cd ${{ env.PUBLISH_DIR }} && zip -r ../api.zip .

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.APP_SERVICE_NAME }}
          package: ${{ env.PACKAGE_PATH }}

      - name: Smoke test /health over HTTPS
        env:
          HEALTH_URL: https://${{ vars.APP_SERVICE_NAME }}.azurewebsites.net/health
          EXPECTED_BODY: '{"status":"ok"}'
        run: |
          echo "Probing $HEALTH_URL"
          for attempt in 1 2 3 4 5 6; do
            body=$(curl --fail -sS "$HEALTH_URL") && {
              echo "Attempt $attempt: $body"
              if [ "$body" = "$EXPECTED_BODY" ]; then
                echo "Health check passed."
                exit 0
              else
                echo "Unexpected body. Expected: $EXPECTED_BODY"
              fi
            } || echo "Attempt $attempt failed; retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 6 attempts."
          exit 1
