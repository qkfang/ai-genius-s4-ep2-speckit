name: Deploy API to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - prod

permissions:
  contents: read
  id-token: write   # required for azure/login OIDC

concurrency:
  group: deploy-api-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy API
    runs-on: ubuntu-latest
    steps:
      - name: Validate APP_SERVICE_NAME is set
        if: ${{ vars.APP_SERVICE_NAME == '' }}
        run: |
          echo "::error::APP_SERVICE_NAME repository variable is not set"
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish API (Release)
        run: dotnet publish src/ai-genius-api/ai-genius-api.csproj -c Release -o ./publish

      - name: Zip publish output
        run: cd publish && zip -r ../publish.zip .

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.APP_SERVICE_NAME }}
          package: ./publish.zip
